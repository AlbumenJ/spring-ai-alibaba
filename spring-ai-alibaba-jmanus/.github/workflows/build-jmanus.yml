name: Build JManus Cross-Platform

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version (optional, defaults to SNAPSHOT)'
        required: false
        default: '3.0.0-SNAPSHOT'
        type: string

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            native_executable: spring-ai-alibaba-jmanus.exe
            artifact_name: jmanus-windows-x64
          - os: macos-13
            platform: macos-x86
            native_executable: spring-ai-alibaba-jmanus
            artifact_name: jmanus-macos-x86
          - os: macos-latest
            platform: macos-arm
            native_executable: spring-ai-alibaba-jmanus
            artifact_name: jmanus-macos-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Visual Studio Build Tools (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build project and run tests
        run: mvn clean compile test-compile
        working-directory: .

      - name: Build native executable
        run: mvn clean -Pnative native:compile
        working-directory: .
        env:
          MAVEN_OPTS: "-Xmx4g"

      - name: Verify native executable
        run: |
          if [ -f "target/${{ matrix.native_executable }}" ]; then
            echo "Native executable built successfully"
            ls -la target/${{ matrix.native_executable }}
            file target/${{ matrix.native_executable }}
          else
            echo "Native executable not found!"
            ls -la target/
            exit 1
          fi
        if: runner.os != 'Windows'
        working-directory: .

      - name: Verify native executable (Windows)
        run: |
          if (Test-Path "target/${{ matrix.native_executable }}") {
            Write-Host "Native executable built successfully"
            Get-ChildItem "target/${{ matrix.native_executable }}" | Format-List
          } else {
            Write-Host "Native executable not found!"
            Get-ChildItem "target/" | Format-List
            exit 1
          }
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .

      - name: Create distribution directory
        run: |
          mkdir -p dist/${{ matrix.platform }}
          cp target/${{ matrix.native_executable }} dist/${{ matrix.platform }}/
          cp README*.md dist/${{ matrix.platform }}/ || true
          echo "Build completed on ${{ matrix.platform }} at $(date)" > dist/${{ matrix.platform }}/BUILD_INFO.txt
          echo "Version: ${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}" >> dist/${{ matrix.platform }}/BUILD_INFO.txt
          echo "Platform: ${{ matrix.platform }}" >> dist/${{ matrix.platform }}/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> dist/${{ matrix.platform }}/BUILD_INFO.txt
        if: runner.os != 'Windows'
        working-directory: .

      - name: Create distribution directory (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.platform }}"
          Copy-Item "target/${{ matrix.native_executable }}" "dist/${{ matrix.platform }}/"
          Get-ChildItem "README*.md" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist/${{ matrix.platform }}/"
          "Build completed on ${{ matrix.platform }} at $(Get-Date)" | Out-File -FilePath "dist/${{ matrix.platform }}/BUILD_INFO.txt" -Encoding UTF8
          "Version: ${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}" | Out-File -FilePath "dist/${{ matrix.platform }}/BUILD_INFO.txt" -Append -Encoding UTF8
          "Platform: ${{ matrix.platform }}" | Out-File -FilePath "dist/${{ matrix.platform }}/BUILD_INFO.txt" -Append -Encoding UTF8
          "Commit: ${{ github.sha }}" | Out-File -FilePath "dist/${{ matrix.platform }}/BUILD_INFO.txt" -Append -Encoding UTF8
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.platform }}/
          retention-days: 30

  create-release-summary:
    name: Create Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create build summary
        run: |
          echo "# JManus Cross-Platform Build Summary" > BUILD_SUMMARY.md
          echo "" >> BUILD_SUMMARY.md
          echo "**Build Date:** $(date)" >> BUILD_SUMMARY.md
          echo "**Version:** ${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}" >> BUILD_SUMMARY.md
          echo "**Commit:** ${{ github.sha }}" >> BUILD_SUMMARY.md
          echo "**Workflow:** ${{ github.run_id }}" >> BUILD_SUMMARY.md
          echo "" >> BUILD_SUMMARY.md
          echo "## Build Results" >> BUILD_SUMMARY.md
          echo "" >> BUILD_SUMMARY.md
          
          for platform in windows-x64 macos-x86 macos-arm; do
            if [ -d "artifacts/jmanus-$platform" ]; then
              echo "### ✅ $platform" >> BUILD_SUMMARY.md
              echo "- **Status:** Success" >> BUILD_SUMMARY.md
              if [ -f "artifacts/jmanus-$platform/BUILD_INFO.txt" ]; then
                echo "- **Build Info:**" >> BUILD_SUMMARY.md
                sed 's/^/  - /' "artifacts/jmanus-$platform/BUILD_INFO.txt" >> BUILD_SUMMARY.md
              fi
              echo "" >> BUILD_SUMMARY.md
            else
              echo "### ❌ $platform" >> BUILD_SUMMARY.md
              echo "- **Status:** Failed" >> BUILD_SUMMARY.md
              echo "" >> BUILD_SUMMARY.md
            fi
          done
          
          echo "## Artifacts" >> BUILD_SUMMARY.md
          echo "" >> BUILD_SUMMARY.md
          echo "The following artifacts are available for download:" >> BUILD_SUMMARY.md
          echo "" >> BUILD_SUMMARY.md
          find artifacts/ -type f -name "spring-ai-alibaba-jmanus*" | while read file; do
            filename=$(basename "$file")
            platform=$(echo "$file" | cut -d'/' -f2 | sed 's/jmanus-//')
            size=$(du -h "$file" | cut -f1)
            echo "- **$platform**: \`$filename\` ($size)" >> BUILD_SUMMARY.md
          done

      - name: Upload build summary
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: BUILD_SUMMARY.md
          retention-days: 30

      - name: Display summary in job
        run: |
          echo "Build Summary:"
          cat BUILD_SUMMARY.md
