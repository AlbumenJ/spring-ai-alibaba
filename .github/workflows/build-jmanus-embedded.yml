name: Build JManus with Embedded JDK

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version (optional, defaults to SNAPSHOT)'
        required: false
        default: '3.0.0-SNAPSHOT'
        type: string

jobs:
  build:
    name: Build JManus with JDK 21 on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-13
            platform: macos-x64
            artifact_name: jmanus-embedded-jdk-macos-x64
            arch_param: macos-x64
          - os: macos-latest
            platform: macos-arm
            artifact_name: jmanus-embedded-jdk-macos-arm
            arch_param: macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verify Maven wrapper
        run: |
          if [ ! -f "./mvnw" ]; then
            echo "Maven wrapper not found, using system maven"
            alias mvn=mvn
          else
            chmod +x ./mvnw
          fi
        working-directory: spring-ai-alibaba-jmanus

      - name: Build project with embedded JDK
        run: |
          chmod +x script/build_embedded_jdk.sh
          script/build_embedded_jdk.sh --arch ${{ matrix.arch_param }} --version "${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}"
        working-directory: spring-ai-alibaba-jmanus

      - name: Verify build output
        run: |
          if [ -d "dist/${{ matrix.arch_param }}" ]; then
            echo "Build successful for ${{ matrix.arch_param }}"
            ls -la "dist/${{ matrix.arch_param }}/"
            echo ""
            echo "JDK verification:"
            if [ -d "dist/${{ matrix.arch_param }}/jdk" ]; then
              ls -la "dist/${{ matrix.arch_param }}/jdk/"
              echo ""
              echo "Java version check:"
              if [ -f "dist/${{ matrix.arch_param }}/jdk/jdk-21/Contents/Home/bin/java" ]; then
                "dist/${{ matrix.arch_param }}/jdk/jdk-21/Contents/Home/bin/java" -version
              elif [ -f "dist/${{ matrix.arch_param }}/jdk/jdk-21/bin/java" ]; then
                "dist/${{ matrix.arch_param }}/jdk/jdk-21/bin/java" -version
              fi
            fi
            echo ""
            echo "Exploded app verification:"
            if [ -d "dist/${{ matrix.arch_param }}/app/BOOT-INF" ]; then
              echo "Exploded jar structure found:"
              ls -la "dist/${{ matrix.arch_param }}/app/"
              echo "BOOT-INF contents:"
              ls -la "dist/${{ matrix.arch_param }}/app/BOOT-INF/"
            fi
          else
            echo "Build failed for ${{ matrix.arch_param }}"
            ls -la dist/ || echo "No dist directory found"
            exit 1
          fi
        working-directory: spring-ai-alibaba-jmanus

      - name: Test startup script
        run: |
          # Test that the startup script can at least detect the components
          cd "dist/${{ matrix.arch_param }}"
          timeout 10s ./bin/start_jmanus.sh --help || true
          echo "Startup script test completed"
        working-directory: spring-ai-alibaba-jmanus

      - name: Create DMG package (macOS only)
        run: |
          chmod +x script/create_dmg_embedded.sh
          script/create_dmg_embedded.sh \
            --platform "${{ matrix.arch_param }}" \
            --version "${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}"
        working-directory: spring-ai-alibaba-jmanus

      - name: Verify DMG creation
        run: |
          DMG_FILE=$(find dist/ -name "*.dmg" | head -1)
          if [ -f "$DMG_FILE" ]; then
            echo "DMG created successfully: $DMG_FILE"
            ls -lh "$DMG_FILE"
          else
            echo "Warning: DMG creation failed or skipped"
            ls -la dist/
          fi
        working-directory: spring-ai-alibaba-jmanus

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            spring-ai-alibaba-jmanus/dist/${{ matrix.arch_param }}/
            spring-ai-alibaba-jmanus/dist/*.dmg
          retention-days: 30

      - name: Upload DMG separately if exists
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact_name }}-dmg
          path: spring-ai-alibaba-jmanus/dist/*.dmg
          retention-days: 30
        continue-on-error: true

  build-summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JManus with Embedded JDK 21 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK Version**: 21.0.2" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Embedded JDK Distribution" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: macOS x64, macOS ARM64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Distribution Package Contents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`bin/start_jmanus.sh\` - Startup script" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/\` - Exploded Spring Boot application" >> $GITHUB_STEP_SUMMARY
          echo "- \`jdk/jdk-21/\` - Embedded OpenJDK 21" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs/\` - Documentation files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Use" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and extract the distribution package" >> $GITHUB_STEP_SUMMARY
          echo "2. Run: \`./bin/start_jmanus.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Open browser to: http://localhost:18080" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No additional Java installation required!"
