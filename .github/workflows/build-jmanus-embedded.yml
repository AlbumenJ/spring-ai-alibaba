name: Build JManus with Embedded JDK

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version (optional, defaults to SNAPSHOT)'
        required: false
        default: '3.0.0-SNAPSHOT'
        type: string

jobs:
  build:
    name: Build JManus with JDK 21 on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm
            artifact_name: jmanus-macos-x64
            arch_param: macos-x64
          - os: macos-latest
            platform: macos-arm
            artifact_name: jmanus-macos-arm
            arch_param: macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build project with embedded JDK
        run: |
          chmod +x script/build_embedded_jdk.sh
          script/build_embedded_jdk.sh --arch ${{ matrix.arch_param }} --version "${{ github.event.inputs.build_version || '3.0.0-SNAPSHOT' }}"
        working-directory: spring-ai-alibaba-jmanus

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            spring-ai-alibaba-jmanus/dist/*.dmg
          retention-days: 30
