name: Check Chinese Content in Jmanus

on:
  pull_request:
    paths:
      - 'spring-ai-alibaba-jmanus/src/main/java/**/*.java'
    types: [opened, synchronize, reopened]

jobs:
  check-chinese-content:
    runs-on: ubuntu-latest
    name: Check for Chinese content in Java files
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Check Chinese content in Jmanus Java files
      id: check-chinese
      run: |
        cd spring-ai-alibaba-jmanus
        python scripts/check-chinese-content.py --dir src/main/java --fail-on-found
      continue-on-error: true

    - name: Comment on PR if Chinese content found
      if: steps.check-chinese.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // 运行检查脚本获取详细信息
          const { exec } = require('child_process');
          const util = require('util');
          const execPromise = util.promisify(exec);
          
          try {
            // 重新运行检查脚本获取详细输出（不使用 --fail-on-found 以获取完整输出）
            const { stdout, stderr } = await execPromise('cd spring-ai-alibaba-jmanus && python scripts/check-chinese-content.py --dir src/main/java');
            
            const comment = `## 🚨 Chinese Content Detected

Chinese content has been detected in Java files under \`spring-ai-alibaba-jmanus/src/main/java\` directory.

### Check Results:
\`\`\`
${stdout}
${stderr}
\`\`\`

### Modification Suggestions:

1. **Chinese Comments** → Change to English Comments
   \`\`\`java
   // ❌ Incorrect Example
   // 这是一个用户服务类
   public class UserService {

   // ✅ Correct Example
   // This is a user service class
   public class UserService {
   \`\`\`

2. **Chinese Strings** → Extract to resource files or use English
   \`\`\`java
   // ❌ Incorrect Example
   throw new RuntimeException("用户不存在");

   // ✅ Correct Example
   throw new RuntimeException("User not found");
   // Or use resource files
   throw new RuntimeException(messageSource.getMessage("user.not.found", null, locale));
   \`\`\`

3. **Chinese Identifiers** → Change to English Identifiers
   \`\`\`java
   // ❌ Incorrect Example
   String 用户名 = "admin";

   // ✅ Correct Example
   String username = "admin";
   \`\`\`

### Why Avoid Chinese Content?

- 🌍 **Internationalization Friendly**: Facilitates project internationalization and localization
- 🔧 **Development Environment Compatibility**: Avoids encoding issues across different operating systems and IDEs
- 👥 **Team Collaboration**: Enables international team members to understand and maintain code
- 📚 **Code Standards**: Follows open source project best practices

Please modify the relevant files and resubmit. If you have questions, please contact the maintainers.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.error('Error running check script:', error);
            
            const fallbackComment = `## 🚨 Chinese Content Detected

Chinese content has been detected in Java files under \`spring-ai-alibaba-jmanus/src/main/java\` directory.

Please check the following content and modify to English:
- Chinese comments → English comments
- Chinese strings → English strings or extract to resource files
- Chinese identifiers → English identifiers

Please resubmit after modifications are complete.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fallbackComment
            });
          }

    - name: Fail the workflow if Chinese content found
      if: steps.check-chinese.outcome == 'failure'
      run: |
        echo "❌ Chinese content found, please check the results above and modify the relevant files"
        exit 1

    - name: Success message
      if: steps.check-chinese.outcome == 'success'
      run: |
        echo "✅ No Chinese content found, check passed!"
